<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;width:760px;height:500px;display:grid;place-items:center;background:#f6f4e9;color:#29261d;font-family:Georgia,serif}.card{display:flex;flex-direction:column;align-items:center;gap:12px}.book{--h:300px;display:flex;align-items:stretch;height:var(--h);width:max-content;filter:drop-shadow(0 8px 10px rgba(40,38,30,.16))}.spine{display:block;position:relative;flex:none;width:4px;height:100%;border-radius:8px 0 0 8px;background-image:url("kim-quy-cover.png");background-position:left center;background-repeat:no-repeat;background-size:calc(var(--h)*.67) var(--h);box-shadow:inset 1px 0 rgba(0,0,0,.2)}.shadow{display:block;position:relative;z-index:1;flex:none;width:8px;height:100%;background:linear-gradient(90deg,#777873 0%,#9d9d97 45%,#c4c3bd 100%);box-shadow:-2px 2px 6px rgba(0,0,0,.3)}.front{display:block;position:relative;z-index:2;flex:0 1 auto;width:auto;height:var(--h);max-width:calc(var(--h)*.67);object-fit:contain;object-position:center;margin:0 0 0 -6px;clip-path:inset(0 0 0 6px round 10px 2px 2px 10px);border-radius:10px 2px 2px 10px;box-shadow:2px 3px 6px rgba(30,29,20,.2)}h1{margin:0;font:500 32px Georgia,serif;text-align:center}
</style></head><body><div class="card"><div class="book"><span class="spine"></span><span class="shadow"></span><img class="front" src="kim-quy-cover.png"></div><h1>Chúa tàu Kim Quy</h1></div></body></html>
