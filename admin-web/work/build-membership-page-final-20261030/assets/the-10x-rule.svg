<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="100%" height="100%">
  <defs>
    <filter id="tenShadow" x="-20%" y="-10%" width="150%" height="130%">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="tenSpineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C5A012"/>
      <stop offset="70%" stop-color="#F2C94C"/>
      <stop offset="100%" stop-color="#D4AC0D"/>
    </linearGradient>
  </defs>

  <g filter="url(#tenShadow)">
    <!-- 3D Spine (Left) -->
    <polygon points="12,18 36,8 36,302 12,312" fill="url(#tenSpineGrad)"/>
    <text x="-170" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="800" fill="#1A202C" transform="rotate(-90)" letter-spacing="1">THE 10X RULE • GRANT CARDONE</text>

    <!-- Front Cover (White & Yellow) -->
    <polygon points="36,8 220,16 220,310 36,302" fill="#FAF9F6"/>

    <!-- Small Header -->
    <text x="128" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900" fill="#1E293B" text-anchor="middle" letter-spacing="4">THE</text>

    <!-- Giant Yellow 10X Block -->
    <polygon points="44,72 212,78 212,210 44,204" fill="#F4CF38"/>
    <text x="128" y="165" font-family="'Impact', Arial Black, sans-serif" font-size="90" font-weight="900" fill="#1E293B" text-anchor="middle" letter-spacing="-2">10X</text>

    <!-- RULE -->
    <text x="128" y="250" font-family="'Impact', Arial Black, sans-serif" font-size="40" font-weight="900" fill="#1E293B" text-anchor="middle" letter-spacing="3">RULE</text>

    <!-- Author -->
    <text x="128" y="280" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#64748B" text-anchor="middle" letter-spacing="2">GRANT CARDONE</text>
  </g>
</svg>
