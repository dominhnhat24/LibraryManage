<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <linearGradient id="creamBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F2EDE0"/>
    </linearGradient>
    <linearGradient id="ahSpine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="4%" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="7%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="12%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="96%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="400" height="580" fill="url(#creamBg)"/>

  <!-- Top tagline -->
  <text x="200" y="80" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#C93B2B" text-anchor="middle">
    THE MILLION-COPY BESTSELLER
  </text>
  <text x="200" y="102" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8.5" font-weight="600" letter-spacing="1" fill="#6B7280" text-anchor="middle">
    An Easy &amp; Proven Way to Build Good Habits &amp; Break Bad Ones
  </text>

  <!-- Atomic Dots Pattern -->
  <g fill="#A89F91" opacity="0.45">
    <circle cx="200" cy="225" r="3"/>
    <circle cx="160" cy="210" r="2.5"/><circle cx="240" cy="210" r="2.5"/>
    <circle cx="130" cy="240" r="2"/><circle cx="270" cy="240" r="2"/>
    <circle cx="170" cy="265" r="2.2"/><circle cx="230" cy="265" r="2.2"/>
    <circle cx="110" cy="190" r="1.8"/><circle cx="290" cy="190" r="1.8"/>
    <circle cx="90" cy="250" r="1.5"/><circle cx="310" cy="250" r="1.5"/>
    <circle cx="140" cy="170" r="2"/><circle cx="260" cy="170" r="2"/>
    <circle cx="180" cy="150" r="1.5"/><circle cx="220" cy="150" r="1.5"/>
    <circle cx="100" cy="280" r="1.8"/><circle cx="300" cy="280" r="1.8"/>
    <circle cx="140" cy="310" r="2.2"/><circle cx="260" cy="310" r="2.2"/>
    <circle cx="200" cy="325" r="2.5"/>
    <circle cx="70" cy="220" r="1.2"/><circle cx="330" cy="220" r="1.2"/>
    <circle cx="85" cy="160" r="1.2"/><circle cx="315" cy="160" r="1.2"/>
    <circle cx="120" cy="130" r="1.5"/><circle cx="280" cy="130" r="1.5"/>
    <circle cx="160" cy="120" r="1.2"/><circle cx="240" cy="120" r="1.2"/>
    <circle cx="200" cy="115" r="1.5"/>
    <circle cx="75" cy="300" r="1.4"/><circle cx="325" cy="300" r="1.4"/>
    <circle cx="110" cy="340" r="1.5"/><circle cx="290" cy="340" r="1.5"/>
    <circle cx="160" cy="360" r="1.8"/><circle cx="240" cy="360" r="1.8"/>
    <circle cx="200" cy="370" r="2"/>
  </g>

  <!-- Titles -->
  <text x="200" y="210" font-family="'Playfair Display', Georgia, serif" font-size="46" font-weight="800" fill="#202224" letter-spacing="2" text-anchor="middle">
    Atomic
  </text>
  <text x="200" y="275" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="800" fill="#202224" letter-spacing="3" text-anchor="middle">
    Habits
  </text>

  <!-- Subtitle -->
  <text x="200" y="325" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="600" fill="#4B5563" letter-spacing="2" text-anchor="middle">
    TÍ HON BIẾN NÊN PHI THƯỜNG
  </text>

  <!-- Author -->
  <line x1="80" y1="440" x2="320" y2="440" stroke="#C93B2B" stroke-width="1.5"/>
  <text x="200" y="475" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="4" fill="#202224" text-anchor="middle">
    JAMES CLEAR
  </text>

  <rect width="400" height="580" fill="url(#ahSpine)"/>
</svg>
