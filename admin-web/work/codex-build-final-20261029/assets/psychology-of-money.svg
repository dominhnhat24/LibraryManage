<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="100%" height="100%">
  <defs>
    <filter id="moneyShadow" x="-20%" y="-10%" width="150%" height="130%">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="moneySpineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="80%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <g filter="url(#moneyShadow)">
    <!-- 3D Spine (Left) -->
    <polygon points="12,18 36,8 36,302 12,312" fill="url(#moneySpineGrad)"/>
    <text x="-180" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#334155" transform="rotate(-90)" letter-spacing="1">THE PSYCHOLOGY OF MONEY • MORGAN HOUSEL</text>

    <!-- Front Cover (White minimalist) -->
    <polygon points="36,8 220,16 220,310 36,302" fill="#FAF9F6"/>

    <!-- Small Header -->
    <text x="128" y="55" font-family="'Playfair Display', Georgia, serif" font-size="14" font-style="italic" fill="#334155" text-anchor="middle">The</text>

    <!-- Main Title -->
    <text x="128" y="86" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="800" fill="#1E293B" text-anchor="middle" letter-spacing="0.5">Psychology</text>
    <text x="128" y="106" font-family="'Playfair Display', Georgia, serif" font-size="14" font-style="italic" fill="#334155" text-anchor="middle">of</text>
    <text x="128" y="138" font-family="'Playfair Display', Georgia, serif" font-size="32" font-weight="800" fill="#1E293B" text-anchor="middle" letter-spacing="1">Money</text>

    <!-- Intricate Dollar / Currency Etching Artwork -->
    <g transform="translate(128, 195)" stroke="#334155" stroke-width="0.8" fill="none">
      <circle cx="0" cy="0" r="32" stroke-dasharray="3,1.5"/>
      <circle cx="0" cy="0" r="24"/>
      <circle cx="0" cy="0" r="16"/>
      <path d="M -18 -8 Q 0 -22 18 -8 Q 0 6 -18 -8"/>
      <path d="M -18 8 Q 0 -6 18 8 Q 0 22 -18 8"/>
      <circle cx="0" cy="0" r="5" fill="#334155"/>
    </g>

    <!-- Subtitle -->
    <text x="128" y="248" font-family="'Plus Jakarta Sans', sans-serif" font-size="5.5" font-weight="700" letter-spacing="1" fill="#64748B" text-anchor="middle">TIMELESS LESSONS ON WEALTH, GREED, AND HAPPINESS</text>

    <!-- Author -->
    <text x="128" y="280" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" letter-spacing="2" fill="#1E293B" text-anchor="middle">MORGAN HOUSEL</text>
  </g>
</svg>
