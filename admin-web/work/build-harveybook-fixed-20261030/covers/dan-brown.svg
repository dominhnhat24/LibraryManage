<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <radialGradient id="keyholeLight" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="25%" stop-color="#E5A630"/>
      <stop offset="65%" stop-color="#14284A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#08101E"/>
    </radialGradient>
    <linearGradient id="dbBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1526"/>
      <stop offset="50%" stop-color="#102038"/>
      <stop offset="100%" stop-color="#050A14"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF5C2"/>
      <stop offset="60%" stop-color="#DDB355"/>
      <stop offset="100%" stop-color="#FFE082"/>
    </linearGradient>
    <linearGradient id="dbSpine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="4%" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="7%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="12%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="97%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="400" height="580" fill="url(#dbBg)"/>

  <!-- Geometric Blueprint Circles -->
  <circle cx="200" cy="330" r="140" stroke="#254B78" stroke-width="0.8" fill="none" opacity="0.6"/>
  <circle cx="200" cy="330" r="110" stroke="#3A6C9E" stroke-width="0.8" stroke-dasharray="4,4" fill="none" opacity="0.7"/>
  <circle cx="200" cy="330" r="75" stroke="#F5B842" stroke-width="1" fill="none" opacity="0.4"/>
  <circle cx="200" cy="330" r="170" fill="url(#keyholeLight)"/>

  <!-- Compass / Crosshair Lines -->
  <line x1="200" y1="180" x2="200" y2="480" stroke="#3A6C9E" stroke-width="0.6" stroke-dasharray="6,4" opacity="0.5"/>
  <line x1="50" y1="330" x2="350" y2="330" stroke="#3A6C9E" stroke-width="0.6" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- Glowing Keyhole Silhouette -->
  <g fill="#FFE994" filter="drop-shadow(0 0 12px #FFA826)">
    <!-- Top circle of keyhole -->
    <circle cx="200" cy="310" r="24"/>
    <!-- Trapezoid slot -->
    <polygon points="186,322 214,322 222,365 178,365"/>
  </g>

  <!-- Inner brilliant light burst -->
  <circle cx="200" cy="310" r="12" fill="#FFFFFF"/>

  <!-- Author Header -->
  <text x="200" y="90" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="900" letter-spacing="4" fill="url(#goldText)" text-anchor="middle">
    DAN BROWN
  </text>
  <line x1="120" y1="110" x2="280" y2="110" stroke="#DDB355" stroke-width="1.2" opacity="0.8"/>

  <!-- Title: DÀNH MẤT (DECEPTION POINT / ORIGIN) -->
  <text x="200" y="470" font-family="'Playfair Display', Georgia, serif" font-size="32" font-weight="800" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">
    DÀNH MẤT
  </text>
  <text x="200" y="505" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="3" fill="#93B4D8" text-anchor="middle">
    TIỂU THUYẾT TRINH THÁM
  </text>

  <rect width="400" height="580" fill="url(#dbSpine)"/>
</svg>
